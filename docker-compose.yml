name: chatbi-v2

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      CHATBI_ENVIRONMENT: development
      CHATBI_DATABASE_URL: ${CHATBI_DATABASE_URL:-postgresql+psycopg://chatbi_app:${CHATBI_META_PASSWORD:?Run scripts/bootstrap-local-databases.ps1 first}@host.docker.internal:5432/chatbi_v2}
      CHATBI_DATASOURCE_SECRET_KEY: ${CHATBI_DATASOURCE_SECRET_KEY:?Run scripts/bootstrap-local-databases.ps1 first}
      CHATBI_SEED_DEMO_SEMANTIC_MODEL: "true"
      CHATBI_DEMO_POSTGRES_HOST: host.docker.internal
      CHATBI_DEMO_POSTGRES_PORT: "5432"
      CHATBI_DEMO_POSTGRES_DATABASE: chatbi_v2
      CHATBI_DEMO_POSTGRES_SCHEMA: demo_business
      CHATBI_DEMO_POSTGRES_USERNAME: chatbi_reader
      CHATBI_DEMO_POSTGRES_PASSWORD: ${CHATBI_DEMO_POSTGRES_PASSWORD:?Run scripts/bootstrap-local-databases.ps1 first}
      CHATBI_DEMO_MYSQL_HOST: host.docker.internal
      CHATBI_DEMO_MYSQL_PORT: "3306"
      CHATBI_DEMO_MYSQL_DATABASE: chatbi_demo_business
      CHATBI_DEMO_MYSQL_USERNAME: chatbi_reader
      CHATBI_DEMO_MYSQL_PASSWORD: ${CHATBI_DEMO_MYSQL_PASSWORD:?Run scripts/bootstrap-local-databases.ps1 first}
      CHATBI_MODEL_PROVIDER: ${CHATBI_MODEL_PROVIDER:-deterministic}
      CHATBI_MODEL_BASE_URL: ${CHATBI_MODEL_BASE_URL:-}
      CHATBI_MODEL_API_KEY: ${CHATBI_MODEL_API_KEY:-}
      CHATBI_MODEL_NAME: ${CHATBI_MODEL_NAME:-}
      CHATBI_KIMI_BASE_URL: ${CHATBI_KIMI_BASE_URL:-https://api.moonshot.cn/v1}
      CHATBI_KIMI_API_KEY: ${CHATBI_KIMI_API_KEY:-}
      CHATBI_KIMI_MODEL_NAME: ${CHATBI_KIMI_MODEL_NAME:-kimi-k2.6}
      CHATBI_MIMO_BASE_URL: ${CHATBI_MIMO_BASE_URL:-https://api.xiaomimimo.com/v1}
      CHATBI_MIMO_API_KEY: ${CHATBI_MIMO_API_KEY:-}
      CHATBI_MIMO_MODEL_NAME: ${CHATBI_MIMO_MODEL_NAME:-mimo-v2.5}
      CHATBI_DEEPSEEK_BASE_URL: ${CHATBI_DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      CHATBI_DEEPSEEK_API_KEY: ${CHATBI_DEEPSEEK_API_KEY:-}
      CHATBI_DEEPSEEK_MODEL_NAME: ${CHATBI_DEEPSEEK_MODEL_NAME:-deepseek-v4-flash}
      CHATBI_QUERY_TIMEOUT_MS: ${CHATBI_QUERY_TIMEOUT_MS:-8000}
      CHATBI_QUERY_ROW_LIMIT: ${CHATBI_QUERY_ROW_LIMIT:-500}
      CHATBI_QUERY_CONCURRENCY: ${CHATBI_QUERY_CONCURRENCY:-4}
      CHATBI_CONTEXT_TOKEN_BUDGET: ${CHATBI_CONTEXT_TOKEN_BUDGET:-6000}
      CHATBI_RAG_MODE: ${CHATBI_RAG_MODE:-shadow}
      CHATBI_AGENT_MODE: ${CHATBI_AGENT_MODE:-off}
      CHATBI_AGENT_ALLOWED_ROUTES: ${CHATBI_AGENT_ALLOWED_ROUTES:-}
      CHATBI_RAG_FALLBACK_ENABLED: ${CHATBI_RAG_FALLBACK_ENABLED:-true}
      CHATBI_AGENT_FALLBACK_ENABLED: ${CHATBI_AGENT_FALLBACK_ENABLED:-true}
      CHATBI_LEGACY_RAG_BASE_URL: ${CHATBI_LEGACY_RAG_BASE_URL:-}
      CHATBI_LEGACY_RAG_BEARER_TOKEN: ${CHATBI_LEGACY_RAG_BEARER_TOKEN:-}
      CHATBI_LEGACY_RAG_REQUIRE_WORKSPACE_ECHO: ${CHATBI_LEGACY_RAG_REQUIRE_WORKSPACE_ECHO:-true}
      CHATBI_LEGACY_AGENT_BASE_URL: ${CHATBI_LEGACY_AGENT_BASE_URL:-}
      CHATBI_LEGACY_AGENT_BEARER_TOKEN: ${CHATBI_LEGACY_AGENT_BEARER_TOKEN:-}
      CHATBI_AGENT_TIMEOUT_MS: ${CHATBI_AGENT_TIMEOUT_MS:-15000}
      CHATBI_AGENT_MAX_STEPS: ${CHATBI_AGENT_MAX_STEPS:-4}
      CHATBI_AGENT_TOKEN_BUDGET: ${CHATBI_AGENT_TOKEN_BUDGET:-4000}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${CHATBI_BACKEND_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)"]
      interval: 4s
      timeout: 4s
      retries: 30
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    ports:
      - "${CHATBI_FRONTEND_PORT:-5173}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null || exit 1"]
      interval: 4s
      timeout: 4s
      retries: 30
    restart: unless-stopped
