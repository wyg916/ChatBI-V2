name: ${COMPOSE_PROJECT_NAME:-chatbi-v2}

services:
  backend:
    image: ${CHATBI_BACKEND_IMAGE:-${COMPOSE_PROJECT_NAME:-chatbi-v2}-backend}
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      CHATBI_ENVIRONMENT: ${CHATBI_ENVIRONMENT:-local}
      CHATBI_GIT_SHA: ${CHATBI_GIT_SHA:-UNAVAILABLE}
      CHATBI_RELEASE_VERSION: ${CHATBI_RELEASE_VERSION:-v1.3.1}
      CHATBI_FRONTEND_BUILD: ${CHATBI_FRONTEND_BUILD:-production}
      CHATBI_SHOWCASE_DATABASE_NAME: ${CHATBI_SHOWCASE_DATABASE_NAME:-chatbi_v2}
      CHATBI_DATABASE_URL: ${CHATBI_DATABASE_URL:?Set CHATBI_DATABASE_URL in the environment file}
      CHATBI_DATABASE_SCHEMA: ${CHATBI_DATABASE_SCHEMA:-}
      CHATBI_DATASOURCE_SECRET_KEY: ${CHATBI_DATASOURCE_SECRET_KEY:?Run scripts/bootstrap-local-databases.ps1 first}
      CHATBI_RAG_SHARED_SECRET: ${CHATBI_RAG_SHARED_SECRET:?Run scripts/bootstrap-local-databases.ps1 first}
      CHATBI_BOOTSTRAP_ADMIN_PASSWORD: ${CHATBI_BOOTSTRAP_ADMIN_PASSWORD:?Run backend auth-only bootstrap first}
      CHATBI_BOOTSTRAP_ANALYST_PASSWORD: ${CHATBI_BOOTSTRAP_ANALYST_PASSWORD:?Run backend auth-only bootstrap first}
      CHATBI_SEED_DEMO_SEMANTIC_MODEL: ${CHATBI_SEED_DEMO_SEMANTIC_MODEL:-false}
      CHATBI_DEMO_POSTGRES_HOST: ${CHATBI_DEMO_POSTGRES_HOST:-host.docker.internal}
      CHATBI_DEMO_POSTGRES_PORT: ${CHATBI_DEMO_POSTGRES_PORT:-5432}
      CHATBI_DEMO_POSTGRES_DATABASE: ${CHATBI_DEMO_POSTGRES_DATABASE:-chatbi_v2}
      CHATBI_DEMO_POSTGRES_SCHEMA: ${CHATBI_DEMO_POSTGRES_SCHEMA:-demo_business}
      CHATBI_DEMO_POSTGRES_USERNAME: ${CHATBI_DEMO_POSTGRES_USERNAME:-chatbi_reader}
      CHATBI_DEMO_POSTGRES_PASSWORD: ${CHATBI_DEMO_POSTGRES_PASSWORD:-}
      CHATBI_DEMO_MYSQL_HOST: ${CHATBI_DEMO_MYSQL_HOST:-host.docker.internal}
      CHATBI_DEMO_MYSQL_PORT: ${CHATBI_DEMO_MYSQL_PORT:-3306}
      CHATBI_DEMO_MYSQL_DATABASE: ${CHATBI_DEMO_MYSQL_DATABASE:-chatbi_demo_business}
      CHATBI_DEMO_MYSQL_USERNAME: ${CHATBI_DEMO_MYSQL_USERNAME:-chatbi_reader}
      CHATBI_DEMO_MYSQL_PASSWORD: ${CHATBI_DEMO_MYSQL_PASSWORD:-}
      CHATBI_MODEL_PROVIDER: ${CHATBI_MODEL_PROVIDER:-auto}
      CHATBI_MODEL_BUDGET_MODE: ${CHATBI_MODEL_BUDGET_MODE:-balanced}
      CHATBI_MODEL_BASE_URL: ${CHATBI_MODEL_BASE_URL:-}
      CHATBI_MODEL_API_KEY: ${CHATBI_MODEL_API_KEY:-}
      CHATBI_MODEL_NAME: ${CHATBI_MODEL_NAME:-}
      CHATBI_KIMI_BASE_URL: ${CHATBI_KIMI_BASE_URL:-https://api.moonshot.cn/v1}
      CHATBI_KIMI_API_KEY: ${CHATBI_KIMI_API_KEY:-}
      CHATBI_KIMI_MODEL_NAME: ${CHATBI_KIMI_MODEL_NAME:-kimi-k2.6}
      CHATBI_MIMO_BASE_URL: ${CHATBI_MIMO_BASE_URL:-https://api.xiaomimimo.com/v1}
      CHATBI_MIMO_API_KEY: ${CHATBI_MIMO_API_KEY:-}
      CHATBI_MIMO_MODEL_NAME: ${CHATBI_MIMO_MODEL_NAME:-mimo-v2.5}
      CHATBI_DEEPSEEK_BASE_URL: ${CHATBI_DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      CHATBI_DEEPSEEK_API_KEY: ${CHATBI_DEEPSEEK_API_KEY:-}
      CHATBI_DEEPSEEK_MODEL_NAME: ${CHATBI_DEEPSEEK_MODEL_NAME:-deepseek-v4-flash}
      CHATBI_QUERY_TIMEOUT_MS: ${CHATBI_QUERY_TIMEOUT_MS:-30000}
      CHATBI_QUERY_ROW_LIMIT: ${CHATBI_QUERY_ROW_LIMIT:-500}
      CHATBI_QUERY_CONCURRENCY: ${CHATBI_QUERY_CONCURRENCY:-4}
      CHATBI_QUERY_MAX_ESTIMATED_COST: ${CHATBI_QUERY_MAX_ESTIMATED_COST:-1000000}
      CHATBI_VERIFICATION_QUERY_ENABLED: ${CHATBI_VERIFICATION_QUERY_ENABLED:-true}
      CHATBI_CONTEXT_TOKEN_BUDGET: ${CHATBI_CONTEXT_TOKEN_BUDGET:-6000}
      CHATBI_SEMANTIC_RUNTIME_MODE: ${CHATBI_SEMANTIC_RUNTIME_MODE:-wren}
      CHATBI_SEMANTIC_UPSTREAM_REUSE_MODE: ${CHATBI_SEMANTIC_UPSTREAM_REUSE_MODE:-selected_source}
      CHATBI_RAG_MODE: ${CHATBI_RAG_MODE:-on}
      CHATBI_AGENT_MODE: ${CHATBI_AGENT_MODE:-on}
      CHATBI_AGENT_ALLOWED_ROUTES: ${CHATBI_AGENT_ALLOWED_ROUTES:-COMPLEX_ANALYSIS}
      CHATBI_RAG_FALLBACK_ENABLED: ${CHATBI_RAG_FALLBACK_ENABLED:-true}
      CHATBI_AGENT_FALLBACK_ENABLED: ${CHATBI_AGENT_FALLBACK_ENABLED:-true}
      CHATBI_LEGACY_RAG_BASE_URL: ${CHATBI_LEGACY_RAG_BASE_URL:-http://rag-runtime:8001}
      CHATBI_LEGACY_RAG_BEARER_TOKEN: ${CHATBI_LEGACY_RAG_BEARER_TOKEN:-}
      CHATBI_LEGACY_RAG_REQUIRE_WORKSPACE_ECHO: ${CHATBI_LEGACY_RAG_REQUIRE_WORKSPACE_ECHO:-true}
      CHATBI_LEGACY_AGENT_BASE_URL: ${CHATBI_LEGACY_AGENT_BASE_URL:-}
      CHATBI_LEGACY_AGENT_BEARER_TOKEN: ${CHATBI_LEGACY_AGENT_BEARER_TOKEN:-}
      CHATBI_AGENT_TIMEOUT_MS: ${CHATBI_AGENT_TIMEOUT_MS:-30000}
      CHATBI_AGENT_MAX_STEPS: ${CHATBI_AGENT_MAX_STEPS:-8}
      CHATBI_AGENT_MAX_TOOL_CALLS: ${CHATBI_AGENT_MAX_TOOL_CALLS:-12}
      CHATBI_AGENT_MAX_REPLAN: ${CHATBI_AGENT_MAX_REPLAN:-2}
      CHATBI_AGENT_MAX_DEPTH: ${CHATBI_AGENT_MAX_DEPTH:-2}
      CHATBI_AGENT_TOKEN_BUDGET: ${CHATBI_AGENT_TOKEN_BUDGET:-6000}
      CHATBI_SESSION_TTL_MINUTES: ${CHATBI_SESSION_TTL_MINUTES:-480}
      CHATBI_REMEMBER_SESSION_TTL_DAYS: ${CHATBI_REMEMBER_SESSION_TTL_DAYS:-30}
      CHATBI_SESSION_COOKIE_SECURE: ${CHATBI_SESSION_COOKIE_SECURE:-false}
      CHATBI_CORS_ALLOW_ORIGINS: ${CHATBI_CORS_ALLOW_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
      CHATBI_ATTACHMENT_MAX_BYTES: ${CHATBI_ATTACHMENT_MAX_BYTES:-26214400}
      CHATBI_ATTACHMENT_MAX_ROWS: ${CHATBI_ATTACHMENT_MAX_ROWS:-100000}
      CHATBI_ATTACHMENT_TEXT_MAX_CHARS: ${CHATBI_ATTACHMENT_TEXT_MAX_CHARS:-200000}
      CHATBI_ATTACHMENT_TTL_HOURS: ${CHATBI_ATTACHMENT_TTL_HOURS:-24}
      CHATBI_ATTACHMENT_STORAGE_DIR: /var/lib/chatbi/attachments
      CHATBI_GENERAL_MODEL_PROVIDER: ${CHATBI_GENERAL_MODEL_PROVIDER:-auto}
      CHATBI_VISION_MODEL_PROVIDER: ${CHATBI_VISION_MODEL_PROVIDER:-auto}
      CHATBI_VISION_MODEL_NAME: ${CHATBI_VISION_MODEL_NAME:-}
      CHATBI_TEST_COST_CONTROL: ${CHATBI_TEST_COST_CONTROL:-NO}
      CHATBI_TEST_EXECUTION_LEVEL: ${CHATBI_TEST_EXECUTION_LEVEL:-LEVEL0}
      CHATBI_PAID_GATE_AUTHORIZED: ${CHATBI_PAID_GATE_AUTHORIZED:-NO}
      CHATBI_LEVEL0_PAID_EXCEPTION: ${CHATBI_LEVEL0_PAID_EXCEPTION:-NO}
      CHATBI_TEST_SHA: ${CHATBI_TEST_SHA:-}
      CHATBI_BACKEND_SHA: ${CHATBI_BACKEND_SHA:-}
      CHATBI_TEST_RUN_ID: ${CHATBI_TEST_RUN_ID:-}
      CHATBI_TEST_GATE: ${CHATBI_TEST_GATE:-}
      CHATBI_TEST_AFFECTED_PATH: ${CHATBI_TEST_AFFECTED_PATH:-}
      CHATBI_TEST_ALLOWED_PROVIDERS: ${CHATBI_TEST_ALLOWED_PROVIDERS:-}
      CHATBI_TEST_BUDGET_CLASS: ${CHATBI_TEST_BUDGET_CLASS:-}
      CHATBI_TEST_BUDGET_CNY: ${CHATBI_TEST_BUDGET_CNY:-}
      CHATBI_TEST_COST_LEDGER_ROOT: ${CHATBI_TEST_COST_LEDGER_ROOT:-}
      CHATBI_TEST_NECESSITY_DECLARATION: ${CHATBI_TEST_NECESSITY_DECLARATION:-NO}
      CHATBI_TEST_DETERMINISTIC_INSUFFICIENT_REASON: ${CHATBI_TEST_DETERMINISTIC_INSUFFICIENT_REASON:-}
      CHATBI_CONFIG_HASH: ${CHATBI_CONFIG_HASH:-}
      CHATBI_PROMPT_VERSION: ${CHATBI_PROMPT_VERSION:-}
      CHATBI_TEST_FINAL_SHA: ${CHATBI_TEST_FINAL_SHA:-}
      CHATBI_FINAL_CERTIFICATION: ${CHATBI_FINAL_CERTIFICATION:-NO}
      CHATBI_PAID_TEST_CACHE_BYPASS: ${CHATBI_PAID_TEST_CACHE_BYPASS:-NO}
      CHATBI_LEVEL0_RECEIPT: ${CHATBI_LEVEL0_RECEIPT:-}
      CHATBI_LEVEL0_VISION_FIXTURE_PATH: ${CHATBI_LEVEL0_VISION_FIXTURE_PATH:-}
      CHATBI_SANDBOX_CONTROLLER_URL: http://sandbox-controller:8765
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - type: bind
        source: ${CHATBI_STORAGE_ROOT:-./.chatbi/storage}
        target: /var/lib/chatbi
    ports:
      - "${CHATBI_BACKEND_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)"]
      interval: 4s
      timeout: 4s
      retries: 30
    restart: unless-stopped
    depends_on:
      sandbox-controller:
        condition: service_healthy
    networks:
      - default
      - sandbox-control

  sandbox-controller:
    image: ${CHATBI_SANDBOX_IMAGE:-${COMPOSE_PROJECT_NAME:-chatbi-v2}-sandbox}
    build:
      context: .
      dockerfile: sandbox_runtime/Dockerfile
    user: "65532:65532"
    command: ["python", "-m", "app.sandbox.controller_server"]
    environment:
      DOCKER_HOST: tcp://sandbox-docker-proxy:2375
      CHATBI_SANDBOX_WORKER_IMAGE: ${CHATBI_SANDBOX_IMAGE:-${COMPOSE_PROJECT_NAME:-chatbi-v2}-sandbox}
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=8m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - sandbox-control
      - sandbox-docker-control
    depends_on:
      sandbox-docker-proxy:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8765/healthz', timeout=2)"]
      interval: 4s
      timeout: 4s
      retries: 30
    restart: unless-stopped

  sandbox-docker-proxy:
    image: ${CHATBI_SANDBOX_IMAGE:-${COMPOSE_PROJECT_NAME:-chatbi-v2}-sandbox}
    user: "0:0"
    command: ["python", "/opt/chatbi/docker_control_proxy.py"]
    environment:
      CHATBI_SANDBOX_WORKER_IMAGE: ${CHATBI_SANDBOX_IMAGE:-${COMPOSE_PROJECT_NAME:-chatbi-v2}-sandbox}
    volumes:
      - type: bind
        source: ${CHATBI_DOCKER_SOCKET_PATH:-/var/run/docker.sock}
        target: /var/run/docker.sock
        read_only: true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=4m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - sandbox-docker-control
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:2375/_ping', timeout=2)"]
      interval: 4s
      timeout: 4s
      retries: 30
    restart: unless-stopped

  rag-runtime:
    image: ${CHATBI_BACKEND_IMAGE:-${COMPOSE_PROJECT_NAME:-chatbi-v2}-backend}
    command: ["uvicorn", "app.rag_runtime.main:app", "--host", "0.0.0.0", "--port", "8001"]
    environment:
      CHATBI_ENVIRONMENT: ${CHATBI_ENVIRONMENT:-local}
      CHATBI_DATABASE_URL: ${CHATBI_DATABASE_URL:?Set CHATBI_DATABASE_URL in the environment file}
      CHATBI_RAG_SHARED_SECRET: ${CHATBI_RAG_SHARED_SECRET:?Run scripts/bootstrap-local-databases.ps1 first}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${CHATBI_RAG_PORT:-8001}:8001"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health', timeout=2)"]
      interval: 4s
      timeout: 4s
      retries: 30
    restart: unless-stopped

  frontend:
    image: ${CHATBI_FRONTEND_IMAGE:-${COMPOSE_PROJECT_NAME:-chatbi-v2}-frontend}
    build:
      context: ./frontend
    ports:
      - "${CHATBI_FRONTEND_PORT:-5173}:80"
    depends_on:
      rag-runtime:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null || exit 1"]
      interval: 4s
      timeout: 4s
      retries: 30
    restart: unless-stopped

  maintenance:
    image: postgres:18.4-alpine
    profiles: ["maintenance"]
    environment:
      CHATBI_PGTOOLS_DATABASE_URL: ${CHATBI_PGTOOLS_DATABASE_URL:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - type: bind
        source: ${CHATBI_BACKUP_ROOT:-./.chatbi/backups}
        target: /backups

networks:
  sandbox-control:
    internal: true
  sandbox-docker-control:
    internal: true
