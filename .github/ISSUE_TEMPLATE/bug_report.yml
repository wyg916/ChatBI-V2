name: Bug report
description: Report a reproducible ChatBI defect using sanitized evidence.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Do not paste API keys, passwords, cookies, database URLs, customer data, or exploitable security details. Use private vulnerability reporting for security issues."
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: v1.4.0 or commit SHA
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Ask Data / NL2SQL
        - Datasource / Catalog
        - Semantic Model
        - Answer Library / Dashboard
        - Evaluation Center
        - Authentication / Authorization
        - Deployment / Upgrade
        - RAG / Bounded Agent
        - Other
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: Use demo data or sanitized examples.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, Docker, database, browser, and deployment mode. Do not include secrets.
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed credentials, personal/customer data, private URLs, and sensitive query results.
          required: true
