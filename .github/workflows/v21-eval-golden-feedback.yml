name: V2.1 Eval Golden Feedback Gate

on:
  push:
    branches: ["codex/v2.1-eval-golden-feedback"]
  pull_request:
    paths:
      - "backend/app/evaluation/**"
      - "backend/app/services/evaluation.py"
      - "backend/app/services/feedback_loop.py"
      - "backend/app/api/routes/evaluation.py"
      - "backend/scripts/run_v13_ibm_official_eval.py"
      - "backend/tests/test_v13_ibm_official_eval.py"
      - "backend/tests/test_v21_eval_feedback.py"
      - "evaluation/golden/**"
      - "frontend/src/pages/Evaluation*"
      - "frontend/e2e/v21-eval-feedback.spec.ts"
  workflow_dispatch:
    inputs:
      api_base:
        description: "Isolated ChatBI API base ending in /api/v1"
        required: false
        type: string

jobs:
  deterministic-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt
      - name: Backend unit and integration
        env:
          PYTHONPATH: >-
            backend:packages/agent-contracts/src:packages/agent-orchestrator/src:packages/prompt-registry/src:packages/rag-adapter/src:packages/rag-contracts/src
        run: pytest backend/tests -q
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Frontend tests and build
        working-directory: frontend
        run: |
          npm ci
          npm test
          npm run build

  isolated-live-release-gate:
    if: github.event_name == 'workflow_dispatch' && inputs.api_base != ''
    needs: deterministic-gate
    runs-on: ubuntu-latest
    env:
      CHATBI_BOOTSTRAP_ADMIN_PASSWORD: ${{ secrets.CHATBI_BOOTSTRAP_ADMIN_PASSWORD }}
      IBM_UPSTREAM_COMMIT: 60dd4515236adb335f2053b7c069397d7d88fe0a
    steps:
      - uses: actions/checkout@v4
      - name: Checkout pinned IBM Text-to-SQL selected source
        uses: actions/checkout@v4
        with:
          repository: IBM/text2sql-eval-toolkit
          ref: 60dd4515236adb335f2053b7c069397d7d88fe0a
          path: vendor/ibm-text2sql-eval-toolkit
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Build pinned IBM isolated environment
        run: uv sync --frozen --no-dev --project vendor/ibm-text2sql-eval-toolkit
      - name: Golden 50, eight-dimension Oracle and feedback replay gate
        run: >-
          python backend/scripts/run_v21_release_gate.py
          --api-base "${{ inputs.api_base }}"
          --require-feedback
          --output docs/evidence/v2.1/eval-feedback-release-gate.json
      - name: IBM official execution compare and error-analysis gate
        run: >-
          python backend/scripts/run_v13_ibm_official_eval.py
          --checkout vendor/ibm-text2sql-eval-toolkit
          --python vendor/ibm-text2sql-eval-toolkit/.venv/bin/python
          --base-url "${{ inputs.api_base }}"
          --output docs/evidence/v2.1/ibm-official-release-gate.json
      - uses: actions/upload-artifact@v4
        with:
          name: v21-eval-feedback-release-gate
          path: |
            docs/evidence/v2.1/eval-feedback-release-gate.json
            docs/evidence/v2.1/ibm-official-release-gate.json
